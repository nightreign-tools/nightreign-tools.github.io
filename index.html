<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightreign Tools</title>
<style>
  :root{
    --gold:#c9a24b;
    --gold-dim:#8a7238;
    --bg:#0b0c10;
    --text:#e9e4d8;
    --text-dim:#8a8578;
    --line:#262832;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:radial-gradient(ellipse at 50% 0%, #1b1c22 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{max-width:520px;padding:40px 20px;text-align:center;}
  h1{font-size:1.15rem;letter-spacing:0.15em;color:var(--gold);font-weight:500;margin:0 0 4px;}
  .sub{font-size:0.75rem;color:var(--text-dim);letter-spacing:0.08em;margin-bottom:36px;}
  .card{
    display:block;
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 18px;
    margin-bottom:16px;
    text-decoration:none;
    color:var(--text);
    background:#14151b;
    transition:border-color 0.2s;
  }
  .card:hover{border-color:var(--gold-dim);}
  .card .name{font-size:1rem;color:var(--gold);letter-spacing:0.08em;margin-bottom:6px;}
  .card .desc{font-size:0.78rem;color:var(--text-dim);line-height:1.6;}
  .note{font-size:0.66rem;color:#565247;margin-top:30px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>NIGHTREIGN TOOLS</h1>
  <div class="sub">エルデンリング ナイトレイン 非公式便利ツール</div>

  <a class="card" href="./nightreign_cycle_timer.html">
    <div class="name">サイクルタイマー</div>
    <div class="desc">昼夜サイクルの円収縮タイミング（4:30 / 11:00 / 14:00）を音とカウントダウンで通知します。</div>
  </a>

  <a class="card" href="./nightreign_merchant_cheatsheet.html">
    <div class="name">商人ラインナップ早見表</div>
    <div class="desc">通常商人が売るレア武器から、村の商人ラインナップを予測できる早見表。片手操作しやすいUIです。</div>
  </a>

  <div class="note">
    本サイトはファンメイドの非公式ツールです。© Bandai Namco Entertainment / FromSoftware, Inc. とは関係ありません。
  </div>
</div>
</body>
</html>
