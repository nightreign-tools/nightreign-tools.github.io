<title>ナイトレイン 商人ラインナップ早見表</title>
<style>
  :root{
    --gold:#c9a24b; --gold-dim:#8a7238; --bg:#0b0c10; --panel:#16171e;
    --red:#b5423a; --blue:#3c6e9e; --green:#4d8a5f; --text:#e9e4d8; --text-dim:#a89f8f; --line:#262832;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:radial-gradient(ellipse at 50% 0%, #1b1c22 0%, var(--bg) 60%);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 50px;}
  h1{font-size:0.95rem;letter-spacing:0.12em;color:var(--gold);font-weight:500;margin:4px 0 2px;text-align:center;}
  .sub{font-size:0.68rem;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:14px;text-align:center;line-height:1.6;}

  .search-bar{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:8px 0 10px;
  }
  .search-bar input{
    width:100%;
    padding:14px 14px;
    font-size:1rem;
    background:#14151b;
    border:1px solid var(--gold-dim);
    border-radius:6px;
    color:var(--text);
    font-family:inherit;
  }
  .search-bar input::placeholder{color:var(--text-dim);}
  .hint{font-size:0.64rem;color:var(--text-dim);text-align:center;margin-bottom:10px;}

  .item-list{display:flex;flex-direction:column;gap:8px;}
  .item{
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
    overflow:hidden;
  }
  .item-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 14px;
    cursor:pointer;
    min-height:52px;
  }
  .item-name{flex:1;font-size:0.88rem;color:var(--text);letter-spacing:0.02em;line-height:1.4;}
  .chevron{color:var(--text-dim);font-size:0.9rem;transition:transform 0.2s;flex-shrink:0;}
  .item.open .chevron{transform:rotate(90deg);color:var(--gold);}

  .item-body{
    display:none;
    padding:0 14px 16px;
    border-top:1px solid var(--line);
  }
  .item.open .item-body{display:block;}
  .body-section{margin-top:12px;}
  .body-label{
    font-size:0.86rem;
    letter-spacing:0.08em;
    margin-bottom:6px;
    font-weight:600;
  }
  .body-label.shop{color:#7ec3ff;}
  .body-label.village{color:#7fe0a0;}
  .body-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;}
  .body-list li{
    font-size:0.78rem;
    color:var(--text);
    background:#0f1015;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    line-height:1.5;
  }
  .no-results{text-align:center;color:var(--text-dim);font-size:0.78rem;padding:30px 0;}

  .note{font-size:0.64rem;color:var(--text-dim);text-align:center;margin-top:20px;line-height:1.8;letter-spacing:0.02em;}
</style>
</head>

      village:["冷たいモーニングスター（HP低下時カット率上昇+23%）","クレプスの黒鍵（HP低下時カット率上昇+30%）","使命の刃（タメ攻撃で黒炎を撒く、攻撃命中時、FP回復+3）","宿将の軍旗（攻撃命中時、HP回復+8）","冷たい氷結の針（刺突カウンター強化+15%、HP最大時カット率上昇+40%）"]},
    {no:20, weapon:"秘文字のパタ", rating:"B",
      shop:["雷の君主軍の直剣（タメ攻撃強化+19%）","毒の獣人曲刀（タメ攻撃命中時、カット率上昇+24%）","神聖なツリースピア（聖攻撃力上昇+9%、戦技の消費FP軽減-18%）","蝕紋の大盾（HP最大時カット率上昇+32%）"],
      village:["しろがねの杖（HP最大時攻撃力上昇+10%）","レドゥビア（敵撃破時、取得ルーン増加+6%、戦技攻撃力上昇+21%）","オルドビスの大剣（タメ攻撃で、聖衝撃波を発生、HP最大時攻撃力上昇+14%）"]}
  ];

  const $ = id => document.getElementById(id);
  const itemList = $("itemList");
  const searchBox = $("searchBox");
  const noResults = $("noResults");

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  let openNo = null;

  function render(filterText){
    const q = (filterText||"").trim();
    const filtered = PATTERNS
      .filter(p => !q || p.weapon.includes(q))
      .slice()
      .sort((a,b) => (READING[a.weapon]||a.weapon).localeCompare(READING[b.weapon]||b.weapon, "ja"));
    if(!filtered.length){
      itemList.innerHTML = "";
      noResults.style.display = "block";
      return;
    }
    noResults.style.display = "none";
    itemList.innerHTML = filtered.map(p=>{
      const isOpen = openNo === p.no;
      let html = '<div class="item'+(isOpen?' open':'')+'" data-no="'+p.no+'">';
      html += '<div class="item-head" data-toggle="'+p.no+'">';
      html += '<div class="item-name">'+escapeHtml(p.weapon)+'</div>';
      html += '<div class="chevron">▶</div>';
      html += '</div>';
      if(isOpen){
        html += '<div class="item-body">';
        html += '<div class="body-section"><div class="body-label shop">■ 店売り（通常商人）の見どころ</div><ul class="body-list">'+p.shop.map(s=>'<li>'+escapeHtml(s)+'</li>').join("")+'</ul></div>';
        html += '<div class="body-section"><div class="body-label village">■ 村売り（村の商人）の見どころ</div><ul class="body-list">'+p.village.map(s=>'<li>'+escapeHtml(s)+'</li>').join("")+'</ul></div>';
        html += '</div>';
      }
      html += '</div>';
      return html;
    }).join("");

    itemList.querySelectorAll("[data-toggle]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const no = parseInt(el.getAttribute("data-toggle"),10);
        openNo = (openNo === no) ? null : no;
        render(searchBox.value);
        if(openNo !== null){
          requestAnimationFrame(()=>{
            const openEl = itemList.querySelector('.item[data-no="'+openNo+'"]');
            if(openEl) openEl.scrollIntoView({behavior:"smooth", block:"start"});
          });
        }
      });
    });
  }

  searchBox.addEventListener("input", ()=>{
    render(searchBox.value);
  });

  render("");
})();
</script>
</body>
</html>
